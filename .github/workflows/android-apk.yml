name: Generar APK Samsung

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Preparar instalador
        run: cp app/build/outputs/apk/debug/app-debug.apk Reportes-SSGroup-Samsung.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Reportes-SSGroup-Samsung-APK
          path: Reportes-SSGroup-Samsung.apk
          retention-days: 30
